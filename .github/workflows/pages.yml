# Publishes the web client to GitHub Pages.
#
# Only the engine is published: neither the ROM nor anything extracted from it
# enters the package (web/build-web.sh aborts if it detects otherwise). Each
# player supplies their own from their own browser.
#
# To enable: Settings > Pages > Source: GitHub Actions.

name: Publish web client

on:
  push:
    branches: [main]
    # A backend-only change doesn't need to rebuild 23 MB of wasm.
    paths:
      - 'web/**'
      - 'gen1recomp/**'
      - 'DramaticShapeVoxelMod/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
    inputs:
      server:
        description: 'Default game server for the build (wss://...). Empty = the page starts with no connection and waits for ?server= in the link.'
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, without cancelling one already in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build the client
        run: |
          if [ -n "${{ github.event.inputs.server }}" ]; then
            web/build-web.sh --server "${{ github.event.inputs.server }}"
          else
            web/build-web.sh
          fi

      # GitHub Pages doesn't serve unknown routes as the main page, so without
      # this a shared link with any route returns 404 instead of opening the
      # game.
      - name: Copy index.html as 404.html
        run: cp web/dist/index.html web/dist/404.html

      # .nojekyll: Jekyll ignores files that start with an underscore, and
      # Emscripten generates some.
      - name: Disable Jekyll
        run: touch web/dist/.nojekyll

      - name: Check that nothing ROM-derived is published
        run: |
          if find web/dist -iname '*.gb' -o -iname '*.gbc' -o -iname '*.sav' | grep -q .; then
            echo "A ROM is in the package: not publishing." >&2
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
